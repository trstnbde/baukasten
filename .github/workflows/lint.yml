name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS / WPCS (${{ matrix.plugin }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        plugin:
          - baukasten
          - baukasten-content-visibility
          - baukasten-login-legal-pages
          - baukasten-consent-blocking-engine
          - baukasten-multi-domain
          - baukasten-business-cards

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: ${{ matrix.plugin }}

      - name: Run PHPCS
        working-directory: ${{ matrix.plugin }}
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate the pull request
        if: ${{ always() }}
        run: cs2pr ${{ matrix.plugin }}/phpcs-report.xml

  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -path ./vendor -prune -o -path '*/vendor' -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l
